services:
  - type: web
    name: backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: EMAIL_DELIVERY_MODE
        value: gmail_api
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
