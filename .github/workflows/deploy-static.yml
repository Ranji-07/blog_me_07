name: Deploy static portfolio

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGES_ARTIFACT_NAME: portfolio-site

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Flutter web app
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --base-href /${{ github.event.repository.name }}/
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: frontend/build/web
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          retries: 3
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            const expectedId = process.env.PAGES_ARTIFACT_ID;
            if (!expectedId) {
              throw new Error('The build job did not return an uploaded artifact ID.');
            }

            for (let attempt = 1; attempt <= 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                name,
                per_page: 100,
              });
              const matches = data.artifacts.filter(artifact => artifact.name === name);
              if (matches.length > 1) {
                throw new Error(`Multiple artifacts named "${name}" exist in this run.`);
              }
              const artifact = matches.find(artifact => String(artifact.id) === expectedId);
              if (artifact?.expired) {
                throw new Error(`Artifact "${name}" has expired. Start a new workflow run to rebuild it.`);
              }
              if (artifact && artifact.size_in_bytes > 0) {
                core.info(`Artifact "${name}" (${artifact.id}) is available for deployment.`);
                return;
              }
              if (attempt < 12) {
                core.info(`Waiting for artifact "${name}" metadata (${attempt}/12)...`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw new Error(`Uploaded artifact "${name}" (${expectedId}) is not visible in this workflow run. Retry the deploy job; if it remains missing, start a new workflow run.`);

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
