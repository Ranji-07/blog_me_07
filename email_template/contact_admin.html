<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>$css</style></head>
<body><div class="card">
  <div class="header"><p class="eyebrow">Portfolio contact</p><h1>A new conversation from $visitor_name</h1></div>
  <div class="content">
    <p>A visitor sent this message through your portfolio. Reply to this email to respond directly to them.</p>
    <div class="meta"><p><strong>Name:</strong> $visitor_name</p><p><strong>Email:</strong> <a href="mailto:$visitor_email">$visitor_email</a></p><p><strong>Received:</strong> $received_at</p></div>
    <p><strong>Message</strong></p><div class="message">$message_html</div>
  </div>
  <div class="footer">Sent by your portfolio contact form.</div>
</div></body></html>
