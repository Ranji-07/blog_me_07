services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./portfolio-backend/uploaded_images:/app/uploaded_images
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U portfolio_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./portfolio-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://portfolio_user:secure_password_123@db:5432/portfolio
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./portfolio-backend:/app
    restart: unless-stopped

  frontend:
    build: ./portfolio
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
